<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RamzLabs · Apps</title>
<meta name="description" content="Apps para Android de RamzLabs y sus políticas de privacidad.">
<style>
  :root {
    --bg: #f7faf9; --fg: #17201e; --muted: #5b6b67; --card: #ffffff;
    --accent: #0f766e; --line: #dde7e4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1514; --fg: #e3ebe9; --muted: #9db0ab; --card: #172120; --accent: #5eead4; --line: #263533; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  .app {
    display: flex; gap: 16px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
  }
  .app img { width: 64px; height: 64px; border-radius: 16px; flex: none; }
  .app h2 { font-size: 1.1rem; margin: 0 0 2px; }
  .app p { margin: 0 0 6px; color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>RamzLabs</h1>
  <p class="sub">Apps para Android · Guadalajara, México</p>

  <!-- Para agregar una app: copia este bloque y cambia carpeta, nombre y descripción. -->
  <div class="app">
    <img src="gestor-deudores/icon.png" alt="">
    <div>
      <h2>Gestor de deudores y cobros</h2>
      <p>Clientes, créditos, pagos y reportes de cobranza.</p>
      <a href="gestor-deudores/">Política de privacidad</a>
    </div>
  </div>

  <div class="app">
    <img src="doc-editor/icon.png" alt="">
    <div>
      <h2>Editor de documentos</h2>
      <p>Lee y edita PDF, Word, Excel y PowerPoint.</p>
      <a href="doc-editor/">Política de privacidad</a>
    </div>
  </div>

  <footer>Contacto: <a href="mailto:oscarivanramirezruiz96@gmail.com">oscarivanramirezruiz96@gmail.com</a></footer>
</main>
</body>
</html>
